<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartify - Register</title>
    <link rel="stylesheet" href="style.css">
    <script>
        function toggleContact() {
            var useEmail = document.getElementById("useEmail").checked;
            var usePhone = document.getElementById("usePhone").checked;

            var emailRow = document.getElementById("emailRow");
            var phoneRow = document.getElementById("phoneRow");
            var emailField = document.getElementById("em");
            var phoneField = document.getElementById("nu");

            if (useEmail) {
                emailRow.style.display = "";
                phoneRow.style.display = "none";
                emailField.disabled = false;
                phoneField.disabled = true;
                phoneField.value = "";
                phoneField.style.backgroundColor = "";
            } else if (usePhone) {
                emailRow.style.display = "none";
                phoneRow.style.display = "";
                emailField.disabled = true;
                phoneField.disabled = false;
                emailField.value = "";
                emailField.style.backgroundColor = "";
            } else {
                // No contact option selected — show both as required
                emailRow.style.display = "";
                phoneRow.style.display = "";
                emailField.disabled = false;
                phoneField.disabled = false;
            }
        }

        function registervalidation() {
            // Clear previous highlights
            var fields = ["n", "d", "em", "nu", "u", "p"];
            for (var i = 0; i < fields.length; i++) {
                document.getElementById(fields[i]).style.backgroundColor = "";
            }
            document.getElementById("e").style.backgroundColor = "";

            var name = document.getElementById("n").value.trim();
            var genderFemale = document.getElementById("female").checked;
            var genderMale = document.getElementById("male").checked;
            var dob = document.getElementById("d").value;
            var education = document.getElementById("e").value;
            var useEmail = document.getElementById("useEmail").checked;
            var usePhone = document.getElementById("usePhone").checked;
            var email = document.getElementById("em").value.trim();
            var phone = document.getElementById("nu").value.trim();
            var username = document.getElementById("u").value.trim();
            var password = document.getElementById("p").value;

            // Name validation
            if (name == "") {
                alert("Please enter your Name!!");
                document.getElementById("n").focus();
                document.getElementById("n").style.backgroundColor = "red";
                return;
            }
            if (name.length < 3) {
                alert("The Name should be minimum 3 characters long!!");
                document.getElementById("n").focus();
                document.getElementById("n").style.backgroundColor = "red";
                return;
            }
            if (!/^[A-Za-z\s]+$/.test(name)) {
                alert("The Name should contain only letters and spaces!!");
                document.getElementById("n").focus();
                document.getElementById("n").style.backgroundColor = "red";
                return;
            }

            // Gender validation
            if (!genderFemale && !genderMale) {
                alert("Please select your Gender!!");
                return;
            }

            // DOB validation
            if (dob == "") {
                alert("Please select your Date of Birth!!");
                document.getElementById("d").focus();
                document.getElementById("d").style.backgroundColor = "red";
                return;
            }
            var dobDate = new Date(dob);
            var today = new Date();
            var age = today.getFullYear() - dobDate.getFullYear();
            var monthDiff = today.getMonth() - dobDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dobDate.getDate())) {
                age--;
            }
            if (dobDate > today) {
                alert("Date of Birth cannot be in the future!!");
                document.getElementById("d").focus();
                document.getElementById("d").style.backgroundColor = "red";
                return;
            }
            if (age < 18) {
                alert("You must be at least 18 years old to register!!");
                document.getElementById("d").focus();
                document.getElementById("d").style.backgroundColor = "red";
                return;
            }

            // Education validation
            if (education == "") {
                alert("Please select your Education!!");
                document.getElementById("e").focus();
                document.getElementById("e").style.backgroundColor = "red";
                return;
            }

            // Contact option validation — must pick one
            if (!useEmail && !usePhone) {
                alert("Please select a contact method (Email or Phone) to register with!!");
                return;
            }

            // Email validation (only if Email is the chosen contact)
            if (useEmail) {
                if (email == "") {
                    alert("Please enter your Email!!");
                    document.getElementById("em").focus();
                    document.getElementById("em").style.backgroundColor = "red";
                    return;
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    alert("Please enter a valid Email address!!");
                    document.getElementById("em").focus();
                    document.getElementById("em").style.backgroundColor = "red";
                    return;
                }
            }

            // Phone validation (only if Phone is the chosen contact)
            if (usePhone) {
                if (phone == "") {
                    alert("Please enter your Phone number!!");
                    document.getElementById("nu").focus();
                    document.getElementById("nu").style.backgroundColor = "red";
                    return;
                }
                if (!/^[0-9]{10}$/.test(phone)) {
                    alert("Phone number must be exactly 10 digits!!");
                    document.getElementById("nu").focus();
                    document.getElementById("nu").style.backgroundColor = "red";
                    return;
                }
            }

            // Username validation
            if (username == "") {
                alert("Please enter a Username!!");
                document.getElementById("u").focus();
                document.getElementById("u").style.backgroundColor = "red";
                return;
            }
            if (username.length < 4) {
                alert("Username must be at least 4 characters long!!");
                document.getElementById("u").focus();
                document.getElementById("u").style.backgroundColor = "red";
                return;
            }
            if (!/^[A-Za-z0-9_]+$/.test(username)) {
                alert("Username can only contain letters, numbers, and underscores!!");
                document.getElementById("u").focus();
                document.getElementById("u").style.backgroundColor = "red";
                return;
            }

            // Password validation
            if (password == "") {
                alert("Please enter your Password!!");
                document.getElementById("p").focus();
                document.getElementById("p").style.backgroundColor = "red";
                return;
            }
            if (password.length < 8) {
                alert("Password must be at least 8 characters long!!");
                document.getElementById("p").focus();
                document.getElementById("p").style.backgroundColor = "red";
                return;
            }
            if (!/[A-Z]/.test(password)) {
                alert("Password must contain at least one uppercase letter!!");
                document.getElementById("p").focus();
                document.getElementById("p").style.backgroundColor = "red";
                return;
            }
            if (!/[a-z]/.test(password)) {
                alert("Password must contain at least one lowercase letter!!");
                document.getElementById("p").focus();
                document.getElementById("p").style.backgroundColor = "red";
                return;
            }
            if (!/[0-9]/.test(password)) {
                alert("Password must contain at least one number!!");
                document.getElementById("p").focus();
                document.getElementById("p").style.backgroundColor = "red";
                return;
            }
            if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
                alert("Password must contain at least one special character!!");
                document.getElementById("p").focus();
                document.getElementById("p").style.backgroundColor = "red";
                return;
            }

            // All validations passed
            var contactMethod = useEmail ? "Email" : "Phone";
            alert("Registration successful! Welcome to Kartify, " + name +
                "!\nWe will contact you via " + contactMethod + ".");
            document.getElementById("regfrm").submit();
        }
    </script>
</head>

<body>
    <header id="header">
        <table>
            <tr>
                <td>
                    <img src="Logo.png" height="95" width="120" alt="Kartify Logo">
                </td>
                <td>
                    <nav>
                        <a href="Index.html">Home</a>
                        <a href="Login.html">Login</a>
                    </nav>
                </td>
            </tr>
        </table>
    </header>

    <main id="content">
        <h1>Create Your Kartify Account</h1>
        <p>Join millions of happy shoppers today!</p>

        <form name="regfrm" id="regfrm">
            <table>
                <tr>
                    <th colspan="2">Register</th>
                </tr>
                <tr>
                    <td><label for="n">Name</label></td>
                    <td><input type="text" name="n" id="n"></td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="radio" id="female" name="g" value="Female">
                        <label for="female">Female</label><br>
                        <input type="radio" id="male" name="g" value="Male">
                        <label for="male">Male</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="d">DOB</label></td>
                    <td><input type="date" name="d" id="d"></td>
                </tr>
                <tr>
                    <td><label for="e">Education</label></td>
                    <td>
                        <select name="e" id="e">
                            <option value="">-- Select --</option>
                            <option value="SSLC">SSLC</option>
                            <option value="Plus two">Plus two</option>
                            <option value="Graduate">Graduate</option>
                        </select>
                    </td>
                </tr>

                <!-- Choose preferred contact method -->
                <tr>
                    <td>Preferred Contact</td>
                    <td>
                        <input type="radio" id="useEmail" name="contactPref" value="Email" onchange="toggleContact()">
                        <label for="useEmail">Email</label><br>
                        <input type="radio" id="usePhone" name="contactPref" value="Phone" onchange="toggleContact()">
                        <label for="usePhone">Phone</label>
                    </td>
                </tr>

                <!-- Email row — shown/hidden based on selection -->
                <tr id="emailRow">
                    <td><label for="em">Email</label></td>
                    <td><input type="email" name="em" id="em"></td>
                </tr>

                <!-- Phone row — shown/hidden based on selection -->
                <tr id="phoneRow">
                    <td><label for="nu">Phone</label></td>
                    <td><input type="tel" name="nu" id="nu"></td>
                </tr>

                <tr>
                    <td><label for="u">Username</label></td>
                    <td><input type="text" name="u" id="u"></td>
                </tr>
                <tr>
                    <td><label for="p">Password</label></td>
                    <td><input type="password" name="p" id="p"></td>
                </tr>
                <tr>
                    <td><button type="reset" onclick="setTimeout(toggleContact, 0)">Reset</button></td>
                    <td><button type="button" onclick="registervalidation()">Register</button></td>
                </tr>
            </table>
        </form>

        <p>Already have an account? <a href="Login.html">Login here</a></p>
    </main>

    <footer id="footer">
        <p>@Kartify 2025 — Shop Smart, Live Better</p>
    </footer>
</body>

</html>
